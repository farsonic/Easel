name: Bug report
description: Something in Easel doesn't work as it should
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you did, what you expected, and what Easel did instead.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open ...
        2. Choose ...
        3. ...
  - type: input
    id: version
    attributes:
      label: Easel version
      description: Shown in Help > About (for example 1.0).
    validations:
      required: true
  - type: input
    id: system
    attributes:
      label: System
      description: AmigaOS version, MUI version (or Zune/AROS), CPU and accelerator, memory, screen mode (RTG or AGA).
      placeholder: AmigaOS 3.2, MUI 3.8, 68040 (PiStorm), RTG 1280x720
    validations:
      required: true
  - type: textarea
    id: files
    attributes:
      label: Picture or screenshot
      description: Attach the picture that shows the problem if you can (only if it is not private), or a screenshot. A crash's Guru Meditation number helps too.
