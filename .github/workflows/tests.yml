# Native tests of Easel's portable core and codecs (ASan/UBSan) plus the Pillow cross-checks.
# The Amiga build needs vbcc, the NDK and the MUI headers, which are not installed here; see CLAUDE.md.
name: tests
on:
  push:
  pull_request:
jobs:
  native:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Python packages for the cross-checks
        run: pip install pillow
      - name: Native tests
        run: TMP=$RUNNER_TEMP sh tools/test.sh
